<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Attendo"><title>Attendo</title><defs><linearGradient id="m" gradientUnits="userSpaceOnUse" x1="10" y1="6" x2="110" y2="114"><stop offset="0" stop-color="#FFF6EA"/><stop offset="0.22" stop-color="#F4D6AC"/><stop offset="0.44" stop-color="#A8764A"/><stop offset="0.56" stop-color="#EBC793"/><stop offset="0.72" stop-color="#FFF3E0"/><stop offset="1" stop-color="#B8875A"/></linearGradient><radialGradient id="orb" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#FFF6E8"/><stop offset=".42" stop-color="#FFB066"/><stop offset="1" stop-color="#E8732A"/></radialGradient><filter id="bloom" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter><clipPath id="sq"><rect width="120" height="120" rx="30"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2219"/><stop offset="1" stop-color="#0C0806"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".28"/></linearGradient><linearGradient id="sl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9A45" stop-opacity="0"/><stop offset=".3" stop-color="#FFD5A1"/><stop offset=".7" stop-color="#FF9A45"/><stop offset="1" stop-color="#FF9A45" stop-opacity="0"/></linearGradient><linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A45" stop-opacity="0"/><stop offset="1" stop-color="#FF9A45" stop-opacity=".28"/></linearGradient><linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="c"><rect x="14" y="14" width="92" height="92" rx="13"/></clipPath><filter id="sb" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="1.6"/></filter><mask id="mk" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><g fill="none" stroke="#fff" stroke-linecap="round"><path d="M14 38V27a13 13 0 0 1 13-13h11" stroke-width="8"/><path d="M82 14h11a13 13 0 0 1 13 13v11" stroke-width="8"/><path d="M106 82v11a13 13 0 0 1-13 13H82" stroke-width="8"/><path d="M38 106H27a13 13 0 0 1-13-13V82" stroke-width="8"/><path d="M37 93 60 50l23 43" stroke-width="13" stroke-linejoin="round"/></g></mask></defs><style>
.b{transform-box:view-box;transform-origin:60px 60px;animation:in .8s cubic-bezier(.2,.9,.25,1.15) both,ok 5s 1.6s ease-in-out infinite}
.b0{--x:-16px;--y:-16px}.b1{--x:16px;--y:-16px}.b2{--x:16px;--y:16px}.b3{--x:-16px;--y:16px}
.a{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .65s .4s cubic-bezier(.6,0,.2,1) forwards}
.d,.bl{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s .95s cubic-bezier(.3,1.6,.4,1) forwards}
.bl{animation:pop .5s .95s cubic-bezier(.3,1.6,.4,1) forwards,breathe 2.6s 1.5s ease-in-out infinite}
.s{opacity:0;animation:scan 5s 1.2s cubic-bezier(.5,0,.5,1) infinite}
.sh{transform:translateX(-150px);animation:shine 5s 1.9s cubic-bezier(.6,0,.3,1) infinite}
.o1{animation:drift1 9s ease-in-out infinite alternate}.o2{animation:drift2 11s ease-in-out infinite alternate}
@keyframes in{from{opacity:0;transform:translate(var(--x),var(--y)) scale(.88)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes breathe{50%{opacity:.35;transform:scale(1.25)}}
@keyframes scan{0%{opacity:0;transform:translateY(0)}5%{opacity:1}24%{opacity:1}30%{opacity:0;transform:translateY(86px)}100%{opacity:0;transform:translateY(86px)}}
@keyframes ok{0%,28%,46%,100%{stroke:url(#m)}33%,40%{stroke:#4ADE80}}
@keyframes shine{0%{transform:translateX(-150px)}24%,100%{transform:translateX(170px)}}
@keyframes drift1{to{transform:translate(26px,18px)}}
@keyframes drift2{to{transform:translate(-30px,-22px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.a{stroke-dashoffset:0}.d,.bl{transform:none}.sh{display:none}}
</style><g clip-path="url(#sq)"><rect width="120" height="120" fill="url(#bg)"/><g filter="url(#soft)"><circle class="o1" cx="18" cy="14" r="34" fill="#FF9A45" opacity=".62"/><circle class="o2" cx="112" cy="112" r="38" fill="#C2543A" opacity=".55"/></g><rect width="120" height="60" fill="url(#gloss)"/></g><rect x=".75" y=".75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/><g transform="translate(60 60) scale(.86) translate(-60 -60)"><g clip-path="url(#c)"><g class="s"><rect x="14" y="0" width="92" height="22" fill="url(#st)"/><rect x="10" y="20.5" width="100" height="3" fill="url(#sl)" filter="url(#sb)"/><rect x="14" y="21.25" width="92" height="1.5" rx=".75" fill="url(#sl)"/></g></g><g fill="none" stroke="url(#m)" stroke-width="7.5" stroke-linecap="round"><path class="b b0" d="M14 38V27a13 13 0 0 1 13-13h11"/><path class="b b1" d="M82 14h11a13 13 0 0 1 13 13v11"/><path class="b b2" d="M106 82v11a13 13 0 0 1-13 13H82"/><path class="b b3" d="M38 106H27a13 13 0 0 1-13-13V82"/></g><path class="a" pathLength="100" d="M37 93 60 50l23 43" fill="none" stroke="url(#m)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="30" r="11.5" fill="#FF9A45" opacity=".75" filter="url(#bloom)" class="bl"/><circle class="d" cx="60" cy="30" r="8.5" fill="url(#orb)"/><g mask="url(#mk)"><rect class="sh" x="0" y="-20" width="34" height="160" fill="url(#band)" transform="rotate(0)" style="transform-box:view-box"/></g></g></svg>
