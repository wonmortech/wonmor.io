services:
  wonmor-site:
    image: caddy:2-alpine
    container_name: wonmor-site
    restart: unless-stopped
    volumes:
      # Config directory (not a single file) so a replaced Caddyfile is visible to `caddy reload`.
      - ./conf:/etc/caddy:ro
      - ./releases:/srv/releases:ro
    networks:
      - edge

# dtwin edge Caddy shu tarmoqda: wonmor.io -> wonmor-site:80
networks:
  edge:
    external: true
    name: dtwin-prod_default
