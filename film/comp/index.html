<!doctype html>
<html><head><meta charset="utf-8"><title>wonmor film</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { createFilm } from './player.js';
const q = new URLSearchParams(location.search);
const fmt = q.get('fmt') || '9x16';
const tl = await (await fetch(`../out/data/timeline_${fmt}.json`)).json();
const film = await createFilm(document.getElementById('c'), tl, '../out/');
window.film = film;
window.timeline = { fps: tl.fps, duration: tl.duration, width: tl.width, height: tl.height };
if (q.has('t')) film.renderAt(parseFloat(q.get('t')), 1);
else if (q.has('play')) {
  const t0 = performance.now();
  const tick = () => { film.renderAt(((performance.now() - t0) / 1000) % tl.duration, 1); requestAnimationFrame(tick); };
  tick();
}
window.ready = true;
</script></body></html>
