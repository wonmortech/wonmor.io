name: Lighthouse

# PLAN §6/§8: Lighthouse CI on main. Builds the site and audits six pages
# (lighthouserc.json): accessibility, best practices and SEO must be 100,
# performance at least 85 on the median of three runs (local medians 90-97).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Summary
        if: always()
        run: |
          [ -f lhci/manifest.json ] || exit 0
          {
            echo "### Lighthouse (median of 3 runs)"
            echo "| Page | Perf | A11y | BP | SEO |"
            echo "|---|---|---|---|---|"
            node -e "for (const r of require('./lhci/manifest.json').filter((x) => x.isRepresentativeRun)) { const s = r.summary; const p = (v) => Math.round(v * 100); console.log('| ' + new URL(r.url).pathname + ' | ' + p(s.performance) + ' | ' + p(s.accessibility) + ' | ' + p(s['best-practices']) + ' | ' + p(s.seo) + ' |'); }"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: lhci/
          retention-days: 14
