name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # astro build + Pagefind index + check-site (CSP, privacy scan) + check-links
      - name: Build and check
        run: npm run build

      - name: Summary
        run: |
          {
            echo "### Build"
            echo "- pages: $(find site -name index.html | wc -l)"
            echo "- size: $(du -sh site | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
